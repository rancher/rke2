name: Nightly CNI
on:
  schedule:
    - cron: "0 3 * * 1-5"
  workflow_dispatch: {}
  pull_request:
    paths:
      - '.github/workflows/nightly-cni.yaml'
      - 'tests/e2e/cni/**'
      - 'tests/e2e/clusterloadbalancer/**'
      - 'tests/e2e/kubevip/**'
      - 'tests/e2e/scripts/loadbalancer_setup.sh'
      - 'tests/e2e/scripts/kubevip_setup.sh'
      - 'tests/e2e/scripts/calico_ebpf_manifest.sh'

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-e2e-artifacts.yml

  e2e:
    name: "Nightly CNI Tests"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - {test: cni, cni: flannel, filter: iptables}
          - {test: cni, cni: flannel, filter: nftables}
          - {test: cni, cni: canal, filter: iptables}
          - {test: cni, cni: canal, filter: nftables}
          - {test: cni, cni: calico, filter: iptables}
          - {test: cni, cni: calico, filter: nftables}
          - {test: cni, cni: cilium, filter: iptables}
          - {test: clusterloadbalancer, cni: canal, filter: iptables}
          - {test: clusterloadbalancer, cni: calico, filter: ebpf}
          - {test: kubevip, cni: canal, filter: iptables}
          - {test: kubevip, cni: calico, filter: ebpf}
      max-parallel: 3
    steps:
    - name: "Checkout"
      # https://github.com/actions/checkout/releases
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with: {fetch-depth: 1}
    - name: Remove Unnecessary Tools
      run: |
        sudo rm -rf \
          /home/linuxbrew \
          /home/packer \
          /opt/az \
          /opt/microsoft \
          /usr/lib/firefox \
          /usr/lib/google-cloud-sdk \
          /usr/local/julia* \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/az* \
          /usr/share/dotnet \
          /usr/share/miniconda \
          /usr/share/swift
        df -khl
    - name: Set up vagrant and libvirt
      uses: ./.github/actions/vagrant-setup
    - name: Vagrant R/W Cache
      if: github.ref == 'refs/heads/master'
      # https://github.com/actions/cache/releases
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
            ~/.vagrant.d/boxes
        key: vagrant-box-ubuntu-2404
    - name: Vagrant Read Cache
      if: github.ref != 'refs/heads/master'
      # https://github.com/actions/cache/releases
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
            ~/.vagrant.d/boxes
        key: vagrant-box-ubuntu-2404

    - name: Install Go
      uses: ./.github/actions/setup-go
    - name: Install Kubectl
      uses: ./.github/actions/install-kubectl
    - name: Download RKE2 Binary and Runtime Image
      # https://github.com/actions/download-artifact/releases
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: rke2-test-artifacts
        path: ${{ github.workspace }}/artifacts
    - name: Place the artifacts back and compute sha256sum
      run: |
        repo_root="${GITHUB_WORKSPACE}"
        mkdir -p "${repo_root}/dist/artifacts"
        mkdir -p "${repo_root}/build/images"
        mv "${repo_root}/artifacts"/rke2-* "${repo_root}/build/images/"
        mv "${repo_root}/artifacts"/rke2.*-amd64.tar.gz "${repo_root}/dist/artifacts/"
        sha256sum "${repo_root}/dist/artifacts/rke2.linux-amd64.tar.gz" > "${repo_root}/dist/artifacts/sha256sum-amd64.txt"
    - name: "Run ${{ matrix.test }}: ${{ matrix.cni }}/${{ matrix.filter }}"
      working-directory: tests/e2e/${{ matrix.test }}
      run: |
        go test -timeout=45m ./${{ matrix.test }}_test.go -ci -local -cni=${{ matrix.cni }} -filter=${{ matrix.filter }} -ginkgo.v -test.v
