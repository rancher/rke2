on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "docs/**"
      - "updatecli/**"
      - "!.github/workflows/test-suite.yaml"

name: PR Build
permissions:
    contents: read
jobs:
  build-amd64:
    runs-on: runs-on,runner=16cpu-linux-x64,run-id=${{ github.run_id }},image=ubuntu24-full-x64,hdd=64
    steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      with:
        version: type=image,tag=29
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
        set-host: true
    - name: Setup Buildx
      uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - name: Set up Containerd
      run: |
        echo CONTAINERD_ADDRESS=$(docker info -f '{{.Containerd.Address}}') >> "$GITHUB_ENV"
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: make ci
      env:
        BUILD_PARALLEL: true
    - name: Change permissions on build artifacts
      run: |
        sudo chown -R $USER:$USER build/
    - name: Upload Build Artifacts
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: rke2-build-artifacts
        path: |
          build/images/rke2-images.linux-amd64.tar.zst
          build/images/rke2-test-*.tar
  test-conformance:
    runs-on: runs-on,runner=${{ matrix.suite == 'parallel' && '16cpu-linux-x64' || '8cpu-linux-x64' }},run-id=${{ github.run_id }},image=ubuntu24-full-x64,hdd=64
    needs: build-amd64
    env:
      CONFORMANCE_IMAGE: registry.k8s.io/conformance@sha256:d503a15722ea23662c482b72ce01ee6e9efec1e8b9c2d3834aa0c51bb2d0832a
    strategy:
      fail-fast: false
      matrix:
        suite: [parallel, serial]
    steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      with:
        version: type=image,tag=29
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
        set-host: true
    - name: Set up Containerd
      run: |
        echo CONTAINERD_ADDRESS=$(docker info -f '{{.Containerd.Address}}') >> "$GITHUB_ENV"
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Download Build Artifacts
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: rke2-build-artifacts
        path: build/images
    - name: Load Build Artifacts Into Docker
      run: |
        zstd -dc build/images/rke2-images.linux-amd64.tar.zst | docker load
        docker load -i build/images/rke2-test-*.tar
    - name: Load kernel modules
      run: |
       sudo modprobe br_netfilter overlay
    - name: Test Conformance
      env:
        SONOBUOY_SUITE: ${{ matrix.suite }}
        CONFORMANCE_GINKGO_ARGS: --seed=1729 --json-report=/tmp/sonobuoy/results/ginkgo.json
        CONFORMANCE_REPORT_DIR: /tmp/rke2-conformance-results
      run: |
        if [ "$SONOBUOY_SUITE" = parallel ]; then
          export CONFORMANCE_GINKGO_ARGS="$CONFORMANCE_GINKGO_ARGS --procs=14"
        fi
        mkdir -p "$CONFORMANCE_REPORT_DIR"
        (
          while true; do
            date -u '+%FT%TZ'
            cat /proc/loadavg /proc/meminfo /proc/pressure/cpu /proc/pressure/io /proc/pressure/memory /proc/stat /proc/diskstats
            sleep 10
          done
        ) > "$CONFORMANCE_REPORT_DIR/host-resources.log" &
        monitor=$!
        trap 'kill "$monitor"; wait "$monitor" || true' EXIT
        make in-docker-test-conformance
    - name: Audit Conformance Selection
      if: ${{ always() }}
      run: bash scripts/conformance-inventory /tmp/rke2-conformance-results/inventory
    - name: Upload Conformance Results
      if: ${{ always() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: conformance-results-${{ matrix.suite }}
        path: /tmp/rke2-conformance-results/
    - name: Prepare Test Logs on Failure
      if: ${{ failure() }}
      run: |
        sudo cp -r /tmp/rke2-logs ~/rke2-logs
        sudo chown -R $USER:$USER ~/rke2-logs
    - name: Upload Test Logs on Failure
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: rke2-test-logs-${{ matrix.suite }}
        path: ~/rke2-logs/
  build-arm64:
    runs-on: runs-on,runner=8cpu-linux-arm64,run-id=${{ github.run_id }},image=ubuntu24-full-arm64,hdd=64
    steps:
    - name: Set up Docker
      uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
      with:
        version: type=image,tag=29
        daemon-config: '{"features":{"containerd-snapshotter":true}}'
        set-host: true
    - name: Set up Containerd
      run: |
        echo CONTAINERD_ADDRESS=$(docker info -f '{{.Containerd.Address}}') >> "$GITHUB_ENV"
    - name: Checkout code
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
    - name: Build
      run: |
        make ci
