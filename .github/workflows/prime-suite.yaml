name: Prime Suite
on:
  push:
    branches:
      - "updatecli_*"
    paths-ignore:
      - "**.md"
      - "channel.yaml"
      - "install.sh"
      - "updatecli/**"
      - ".github/**"
      - "!.github/workflows/prime-suite.yaml"

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/build-e2e-artifacts.yml
    with:
      setup-docker: true

  prime-docker:
    name: Prime Docker Tests
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Set up Docker
        uses: docker/setup-docker-action@2bf61fb9464cc67f0cbdeabed6aa0380accd1c70 # v5
        with:
          version: type=image,tag=29
          daemon-config: '{"features":{"containerd-snapshotter":true}}'
          set-host: true
      - name: Set up Containerd
        run: |
          echo "CONTAINERD_ADDRESS=$(docker info -f '{{.Containerd.Address}}')" >> "$GITHUB_ENV"
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
      - name: Install Go
        uses: ./.github/actions/setup-go
      - name: Download RKE2 Binary and Runtime Image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: rke2-test-artifacts
          path: ./artifacts
      - name: Place the artifacts back and compute sha256sum
        run: |
          mkdir -p ./dist/artifacts
          mkdir -p ./build/images
          mkdir -p ./bin
          mv ./artifacts/rke2-* ./build/images/
          mv ./artifacts/rke2.*-amd64.tar.gz ./dist/artifacts
          mv ./artifacts/images.txt ./build/images.txt
          sha256sum ./dist/artifacts/rke2.linux-amd64.tar.gz > ./dist/artifacts/sha256sum-amd64.txt
      - name: Load kernel modules
        run: |
          sudo modprobe br_netfilter overlay
      - name: Read secrets
        uses: rancher-eio/read-vault-secrets@dfae8acd43a9e170fca5f90168da22f814fe4e9a # main
        with:
          secrets: |
            secret/data/github/repo/${{ github.repository }}/rancher-prime-registry/credentials registry | PRIME_REGISTRY ;
      - name: Run Tests
        run: go test -v -timeout=20m ./tests/docker/prime/prime_test.go -ginkgo.v -ci -registry "$PRIME_REGISTRY"
  prime-e2e:
    name: "E2E Tests"
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        etest: [cni]
    steps:
    - name: "Checkout"
      uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      with: {fetch-depth: 1}
    - name: Remove Unnecessary Tools
      run: |
        sudo rm -rf \
          /home/linuxbrew \
          /home/packer \
          /opt/az \
          /opt/microsoft \
          /usr/lib/firefox \
          /usr/lib/google-cloud-sdk \
          /usr/local/julia* \
          /usr/local/share/boost \
          /usr/local/share/chromium \
          /usr/local/share/powershell \
          /usr/share/az* \
          /usr/share/dotnet \
          /usr/share/miniconda \
          /usr/share/swift
        df -khl
    - name: Set up vagrant and libvirt
      uses: ./.github/actions/vagrant-setup
    - name: Vagrant R/W Cache
      if: github.ref == 'refs/heads/master'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: |
            ~/.vagrant.d/boxes
        key: vagrant-box-ubuntu-2404
    - name: Vagrant Read Cache
      if: github.ref != 'refs/heads/master'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v5
      with:
        path: |
            ~/.vagrant.d/boxes
        key: vagrant-box-ubuntu-2404
    - name: "Vagrant Plugin(s)"
      env:
        VAGRANT_RKE2_VERSION: "0.2.0"
        VAGRANT_RKE2_CHECKSUM: "b91dbeee2e7f35d4849ff149ce3d4bdb35f1e594b5a889c48b28a2fce346277d"
        VAGRANT_RELOAD_VERSION: "0.0.1"
        VAGRANT_RELOAD_CHECKSUM: "aa03d5e52737586bd5dab740c8bc61690e63c75c0d96383d9bea7520fa05be6a"
        VAGRANT_SCP_VERSION: "0.5.9"
        VAGRANT_SCP_CHECKSUM: "e3adda6c6a059f10e9edfa90a8f08892493010f176a18360a5d92d92847cf329"
      run: |
        for plugin in "vagrant-rke2:${VAGRANT_RKE2_VERSION}:${VAGRANT_RKE2_CHECKSUM}" \
                      "vagrant-reload:${VAGRANT_RELOAD_VERSION}:${VAGRANT_RELOAD_CHECKSUM}" \
                      "vagrant-scp:${VAGRANT_SCP_VERSION}:${VAGRANT_SCP_CHECKSUM}"; do
          name="${plugin%%:*}"
          rest="${plugin#*:}"
          version="${rest%%:*}"
          checksum="${rest##*:}"
          curl -fsSL "https://rubygems.org/gems/${name}-${version}.gem" -o "${name}.gem"
          echo "${checksum}  ${name}.gem" | sha256sum -c
          vagrant plugin install "${name}.gem"
          rm -f "${name}.gem"
        done
    - name: Install Go
      uses: ./.github/actions/setup-go
    - name: Install Kubectl
      env:
        KUBECTL_VERSION: "v1.34.6"
        KUBECTL_CHECKSUM: "3166155b17198c0af34ff5a360bd4d9d58db98bafadc6f3c2a57ae560563cd6b"
      run: |
          curl --retry 3 -fsSL "https://dl.k8s.io/release/${KUBECTL_VERSION}/bin/linux/amd64/kubectl" -o kubectl
          echo "${KUBECTL_CHECKSUM}  kubectl" | sha256sum -c
          sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          rm -f kubectl
    - name: Download RKE2 Binary and Runtime Image
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
      with:
        name: rke2-test-artifacts
        path: ./artifacts
    - name: Place the artifacts back and compute sha256sum
      run: |
        mkdir -p ./dist/artifacts
        mkdir -p ./build/images
        mkdir -p ./bin
        mv ./artifacts/rke2-* ./build/images/
        mv ./artifacts/rke2.*-amd64.tar.gz ./dist/artifacts
        sha256sum ./dist/artifacts/rke2.linux-amd64.tar.gz > ./dist/artifacts/sha256sum-amd64.txt
    - name: "Run Calico CNI Prime Test"
      working-directory: tests/e2e/${{ matrix.test }}
      run: |
        E2E_PRIME=true go test -timeout=45m ./${{ matrix.test }}_test.go -ci -local -cni=calico -ginkgo.v -test.v

