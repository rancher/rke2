name: 'Setup Vagrant and Libvirt'
description: 'A composite action that installs latest versions of vagrant and libvirt for use on ubuntu based runners'
runs:
  using: 'composite'
  steps:
    - name: Add vagrant to apt-get sources
      shell: bash
      run: |
        curl -fsSL https://apt.releases.hashicorp.com/gpg | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg
        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] https://apt.releases.hashicorp.com $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/hashicorp.list
        sudo sed -i 's/^# deb-src/deb-src/' /etc/apt/sources.list
    - name: Install vagrant and libvirt
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y libvirt-daemon libvirt-daemon-system vagrant=2.4.1-1 ruby-libvirt
        sudo systemctl enable --now libvirtd
    - name: Install vagrant dependencies
      shell: bash
      run: |
        sudo apt-get install -y --no-install-recommends libxslt-dev libxml2-dev libvirt-dev ruby-bundler ruby-dev zlib1g-dev
    # This is a workaround for the libvirt group not being available in the current shell
    # https://github.com/actions/runner-images/issues/7670#issuecomment-1900711711
    - name: Make the libvirt socket rw accessible to everyone
      shell: bash
      run: |
        sudo chmod a+rw /var/run/libvirt/libvirt-sock
    - name: Install vagrant-libvirt plugin
      shell: bash
      env:
        VAGRANT_LIBVIRT_VERSION: "0.12.2"
        VAGRANT_LIBVIRT_CHECKSUM: "34c8918eb550a36522f67389c290e6349524fbde60b13f39a7014c222c376f04"
      run: |
        curl -fsSL "https://rubygems.org/gems/vagrant-libvirt-${VAGRANT_LIBVIRT_VERSION}.gem" -o vagrant-libvirt.gem
        echo "${VAGRANT_LIBVIRT_CHECKSUM}  vagrant-libvirt.gem" | sha256sum -c
        vagrant plugin install vagrant-libvirt.gem
        rm -f vagrant-libvirt.gem
    - name: Install Other Vagrant Plugins
      shell: bash
      env:
        VAGRANT_RKE2_VERSION: "0.2.0"
        VAGRANT_RKE2_CHECKSUM: "b91dbeee2e7f35d4849ff149ce3d4bdb35f1e594b5a889c48b28a2fce346277d"
        VAGRANT_RELOAD_VERSION: "0.0.1"
        VAGRANT_RELOAD_CHECKSUM: "aa03d5e52737586bd5dab740c8bc61690e63c75c0d96383d9bea7520fa05be6a"
        VAGRANT_SCP_VERSION: "0.5.9"
        VAGRANT_SCP_CHECKSUM: "e3adda6c6a059f10e9edfa90a8f08892493010f176a18360a5d92d92847cf329"
      run: |
        for plugin in "vagrant-rke2:${VAGRANT_RKE2_VERSION}:${VAGRANT_RKE2_CHECKSUM}" \
                      "vagrant-reload:${VAGRANT_RELOAD_VERSION}:${VAGRANT_RELOAD_CHECKSUM}" \
                      "vagrant-scp:${VAGRANT_SCP_VERSION}:${VAGRANT_SCP_CHECKSUM}"; do
          IFS=: read -r name version checksum <<< "$plugin"
          curl -fsSL "https://rubygems.org/gems/${name}-${version}.gem" -o "${name}.gem"
          echo "${checksum}  ${name}.gem" | sha256sum -c
          vagrant plugin install "${name}.gem"
          rm -f "${name}.gem"
        done