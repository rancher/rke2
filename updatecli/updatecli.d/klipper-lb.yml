---
name: "Update klipper-lb image"
pipelineid: "rke2-charts"
scms:
  rke2:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ requiredEnv .github.username }}"
      token: '{{ requiredEnv .github.token }}'
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repo }}"
      branch: '{{ .github.branch }}'

sources:
  klipperLB:
    name: "Latest klipper-lb build"
    kind: "githubrelease"
    spec:
      owner: "k3s-io"
      repository: "klipper-lb"
      token: '{{ requiredEnv .github.token }}'
      typefilter:
        draft: false
        prerelease: false
        release: true

targets:
  bumpKlipperLB:
    name: 'Bump klipper-lb to {{ source "klipperLB" }}'
    kind: "file"
    scmid: "rke2"
    sourceid: klipperLB
    spec:
      file: scripts/version.sh
      matchpattern: '(?m)^KLIPPERLB_VERSION=\$\{KLIPPERLB_VERSION:-[^}]+\}$'
      replacepattern: 'KLIPPERLB_VERSION=$${KLIPPERLB_VERSION:-{{ source "klipperLB" }}}'

actions:
  github:
    kind: "github/pullrequest"
    scmid: "rke2"
    spec:
      merge:
        strategy: manual
      draft: false
      mergemethod: squash
      labels:
        - kind/updatecli
      title: '[{{ .github.branch }}] Update bundled charts and images'
      description: |
        Automated PR to bump `KLIPPERLB_VERSION` in `scripts/version.sh`.

        Updated references:
        - `rancher/klipper-lb` -> {{ source "klipperLB" }}
