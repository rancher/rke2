---
name: "Update hardened runtime images"
# Watches for new hardened-runc, hardened-containerd, hardened-crictl, and hardened-etcd builds
# and bumps the corresponding FROM tags in the Dockerfile, along with the
# matching containerd and crictl references in Dockerfile.windows, and the etcd
# image tag in scripts/version.sh.
#
# Version filters are pinned to the minor line currently referenced in the
# Dockerfile or scripts/version.sh so we track new builds without jumping across minor/major versions
# (each image-build repo publishes several lines concurrently).
scms:
  rke2:
    kind: "github"
    spec:
      user: "{{ .github.user }}"
      email: "{{ .github.email }}"
      username: "{{ requiredEnv .github.username }}"
      token: '{{ requiredEnv .github.token }}'
      owner: "{{ .github.owner }}"
      repository: "{{ .github.repo }}"
      branch: '{{ .github.branch }}'

sources:
  kubernetesMinor:
    name: "Get Kubernetes minor version from scripts/version.sh"
    kind: "file"
    spec:
      file: scripts/version.sh
      matchpattern: '(?m)^KUBERNETES_VERSION=\$\{KUBERNETES_VERSION:-v\d+\.\d+\.\d+[^}]*\}$'
    transformers:
      - findsubmatch:
          pattern: ':-v(\d+\.\d+)\.'
          captureindex: 1
  hardenedRunc:
    name: "Latest hardened-runc 1.4 build"
    kind: "githubrelease"
    spec:
      owner: "rancher"
      repository: "image-build-runc"
      token: '{{ requiredEnv .github.token }}'
      versionfilter:
        kind: "regex"
        pattern: '^v1\.4\.\d+-build\d+$'
  hardenedContainerd:
    name: "Latest hardened-containerd 2.3 build"
    kind: "githubrelease"
    spec:
      owner: "rancher"
      repository: "image-build-containerd"
      token: '{{ requiredEnv .github.token }}'
      versionfilter:
        kind: "regex"
        pattern: '^v2\.3\.\d+-k3s\d(?:\.\d+)?-build\d+$'
  hardenedCrictl:
    name: "Latest hardened-crictl build"
    kind: "githubrelease"
    dependson:
      - kubernetesMinor
    spec:
      owner: "rancher"
      repository: "image-build-crictl"
      token: '{{ requiredEnv .github.token }}'
      versionfilter:
        kind: "regex"
        pattern: '^v{{ source "kubernetesMinor" }}\.\d+-build\d+$'
  etcd:
    name: "Latest etcd 3.6 build"
    kind: "githubrelease"
    spec:
      owner: "rancher"
      repository: "image-build-etcd"
      token: '{{ requiredEnv .github.token }}'
      versionfilter:
        kind: "regex"
        pattern: '^v3\.6\.\d+-k3s\d+(?:\.\d+)?-build\d+$'
  hardenedContainerdWindowsChecksum:
    name: "Get containerd windows tarball checksum for the selected hardened-containerd build"
    kind: "shell"
    spec:
      command: |
        VERSION=$(echo "{{ source "hardenedContainerd" }}" | cut -d '-' -f 1)
        CHECKSUM=$(curl -sfL "https://github.com/containerd/containerd/releases/download/${VERSION}/containerd-${VERSION#v}-windows-amd64.tar.gz.sha256sum") || exit 1
        echo "${CHECKSUM%% *}"
  hardenedCrictlWindows:
    name: "Get crictl version from the selected hardened-crictl build"
    kind: "shell"
    spec:
      command: echo "{{ source "hardenedCrictl" }}" | cut -d '-' -f 1
  hardenedCrictlWindowsChecksum:
    name: "Get crictl windows tarball checksum for the selected hardened-crictl build"
    kind: "shell"
    spec:
      command: |
        VERSION=$(echo "{{ source "hardenedCrictl" }}" | cut -d '-' -f 1)
        CHECKSUM=$(curl -sfL "https://github.com/kubernetes-sigs/cri-tools/releases/download/${VERSION}/crictl-${VERSION}-windows-amd64.tar.gz.sha256") || exit 1
        echo "${CHECKSUM%% *}"

targets:
  bumpEtcd:
    name: "Update ETCD_IMAGE_TAG in scripts/version.sh"
    kind: "file"
    scmid: "rke2"
    sourceid: etcd
    spec:
      file: scripts/version.sh
      matchpattern: '(?m)^ETCD_IMAGE_TAG=\$\{ETCD_IMAGE_TAG:-[^}]+\}$'
      replacepattern: 'ETCD_IMAGE_TAG=$${ETCD_IMAGE_TAG:-{{ source "etcd" }}}'
  bumpRunc:
    name: "Update hardened-runc image tag in Dockerfile"
    kind: "dockerfile"
    scmid: "rke2"
    sourceid: hardenedRunc
    spec:
      file: Dockerfile
      instruction:
        keyword: "FROM"
        matcher: "rancher/hardened-runc"
  bumpContainerd:
    name: "Update hardened-containerd image tag in Dockerfile"
    kind: "dockerfile"
    scmid: "rke2"
    sourceid: hardenedContainerd
    spec:
      file: Dockerfile
      instruction:
        keyword: "FROM"
        matcher: "rancher/hardened-containerd"
  bumpCrictl:
    name: "Update hardened-crictl image tag in Dockerfile"
    kind: "dockerfile"
    scmid: "rke2"
    sourceid: hardenedCrictl
    spec:
      file: Dockerfile
      instruction:
        keyword: "FROM"
        matcher: "rancher/hardened-crictl"
  bumpContainerdWindows:
    name: "Update hardened-containerd image tag in Dockerfile.windows"
    kind: "file"
    scmid: "rke2"
    sourceid: hardenedContainerd
    spec:
      file: Dockerfile.windows
      matchpattern: 'rancher/hardened-containerd:\S+'
      replacepattern: 'rancher/hardened-containerd:{{ source "hardenedContainerd" }}-amd64-windows'
  bumpContainerdWindowsChecksum:
    name: "Update containerd windows tarball checksum in Dockerfile.windows"
    kind: "file"
    scmid: "rke2"
    sourceid: hardenedContainerdWindowsChecksum
    spec:
      file: Dockerfile.windows
      matchpattern: '"[0-9a-f]{64}  containerd-'
      replacepattern: '"{{ source "hardenedContainerdWindowsChecksum" }}  containerd-'
  bumpCrictlWindows:
    name: "Update CRICTL_VERSION in Dockerfile.windows"
    kind: "file"
    scmid: "rke2"
    sourceid: hardenedCrictlWindows
    spec:
      file: Dockerfile.windows
      matchpattern: 'CRICTL_VERSION=".*"'
      replacepattern: 'CRICTL_VERSION="{{ source "hardenedCrictlWindows" }}"'
  bumpCrictlWindowsChecksum:
    name: "Update crictl windows tarball checksum in Dockerfile.windows"
    kind: "file"
    scmid: "rke2"
    sourceid: hardenedCrictlWindowsChecksum
    spec:
      file: Dockerfile.windows
      matchpattern: '"[0-9a-f]{64}  crictl-'
      replacepattern: '"{{ source "hardenedCrictlWindowsChecksum" }}  crictl-'

actions:
  github:
    kind: "github/pullrequest"
    scmid: "rke2"
    spec:
      merge:
        strategy: manual
      draft: false
      mergemethod: squash
      parent: false
      title: 'Update hardened runtime images'
      description: |
        Automated PR to bump the hardened runtime image tags in the `Dockerfile`
        and the matching containerd and crictl references in `Dockerfile.windows`,
        along with `ETCD_IMAGE_TAG` in `scripts/version.sh`.

        Updated references:
        - `rancher/hardened-runc` -> {{ source "hardenedRunc" }}
        - `rancher/hardened-containerd` -> {{ source "hardenedContainerd" }}
        - `rancher/hardened-crictl` -> {{ source "hardenedCrictl" }}
        - `rancher/hardened-etcd` -> {{ source "etcd" }}
